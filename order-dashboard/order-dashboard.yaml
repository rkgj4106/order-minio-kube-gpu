# 기존 order-etl-config / order-etl-secret을 같은 namespace에서 사용.
# 실제 이미지 이름은 빌드/push한 주소로 변경하세요.
# 모든 metadata.namespace는 ETL이 실행 중인 namespace에 맞추세요.
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-dashboard-config
data:
  DB_TIMEZONE: "Asia/Seoul"
  DISPLAY_TIMEZONE: "Asia/Seoul"
  # 현재 실습의 자체서명 인증서 오류 회피. HTTPS 암호화는 유지.
  # CA를 신뢰하도록 설정한 환경에서는 true로 변경.
  MINIO_VERIFY_SSL: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-dashboard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: order-dashboard
  template:
    metadata:
      labels:
        app: order-dashboard
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # 사설 registry를 사용하는 경우 imagePullSecrets를 지정.
      containers:
        - name: dashboard
          image: yklee2002/order-dashboard
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          # MySQL 연결은 하지 않으며 MinIO 환경변수만 읽습니다.
          env:
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: order-etl-config
                  key: MINIO_ENDPOINT
            - name: MINIO_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: order-etl-config
                  key: MINIO_BUCKET
            - name: MINIO_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: order-etl-config
                  key: MINIO_PREFIX
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: order-etl-secret
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: order-etl-secret
                  key: MINIO_SECRET_KEY
          envFrom:
            - configMapRef:
                name: order-dashboard-config
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: order-dashboard
spec:
  type: NodePort
  selector:
    app: order-dashboard
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30111
